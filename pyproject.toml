[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "groundtrace"
version = "0.1.0"
description = "Local RAG tracing and grounding dashboard."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "sentence-transformers>=3.0.0",
    "numpy>=1.26.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.25.0"]
gemini = ["google-generativeai>=0.7.0"]
mistral = ["mistralai>=1.0.0"]
transformers = ["torch>=2.0.0", "transformers>=4.40.0"]
chromadb = ["chromadb>=0.5.0"]
pinecone = ["pinecone-client>=3.0.0"]
faiss = ["faiss-cpu>=1.8.0"]
weaviate = ["weaviate-client>=4.0.0"]
langchain = ["langchain>=0.2.0"]
pgvector = ["sqlalchemy>=2.0.0"]
pytest = ["pytest>=8.0.0"]
all = [
    "openai>=1.0.0",
    "anthropic>=0.25.0",
    "google-generativeai>=0.7.0",
    "mistralai>=1.0.0",
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "chromadb>=0.5.0",
    "pinecone-client>=3.0.0",
    "faiss-cpu>=1.8.0",
    "weaviate-client>=4.0.0",
    "langchain>=0.2.0",
    "sqlalchemy>=2.0.0",
]

[project.entry-points."pytest11"]
groundtrace = "groundtrace.pytest_plugin"

[project.scripts]
groundtrace = "groundtrace.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["groundtrace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (slow, loads ML models)",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
